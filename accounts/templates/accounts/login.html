{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">ورود</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-6 bg-red-600 text-white font-bold py-2 px-4 rounded hover:bg-red-500">ورود</button>
    </form>
    <div class="mt-4 text-center">
        <a href="{% url 'password_reset_request' %}" class="text-red-600 hover:underline">رمز عبور خود را فراموش کرده‌اید؟</a>
    </div>
</div>
{% endblock %}
