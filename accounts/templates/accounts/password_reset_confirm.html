{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">تغییر رمز عبور</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-6 bg-red-600 text-white font-bold py-2 px-4 rounded hover:bg-red-500">تغییر رمز</button>
    </form>
</div>
{% endblock %}
