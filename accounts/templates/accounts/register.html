{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-8">
    <h2 class="text-2xl font-bold mb-6 text-center">ثبت‌نام</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-6 bg-indigo-600 text-white font-bold py-2 px-4 rounded hover:bg-indigo-500">ثبت‌نام</button>
    </form>
</div>
{% endblock %}
