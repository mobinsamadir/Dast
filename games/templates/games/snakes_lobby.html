{% extends 'base.html' %}
{% block title %}لابی | دست‌دوستی{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto py-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">لابی</h1>
        <a href="{% url 'games_lobby' %}" class="text-sm text-gray-500 hover:text-primary transition-colors">بازگشت <i data-lucide="arrow-left" class="w-4 h-4 inline"></i></a>
    </div>
    <div class="bg-white dark:bg-surface-dark p-8 rounded-3xl border border-gray-100 dark:border-border-dark flex flex-col items-center justify-center">
        <p class="mb-6">هزینه ورود: {{ entry_fee }} سکه</p>
        <form method="POST" action="">
            {% csrf_token %}
            <button type="submit" class="px-8 py-3 bg-primary text-white font-bold rounded-xl">ساخت و ورود به اتاق</button>
        </form>
    </div>
</div>
{% endblock %}
