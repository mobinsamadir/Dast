{% extends 'base.html' %}

{% block title %}معمای روزانه | دست‌دوستی{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-12">
    <div class="bg-white dark:bg-surface-dark rounded-3xl shadow-sm border border-gray-100 dark:border-border-dark p-8 md:p-12 text-center">
        <div class="w-20 h-20 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="brain-circuit" class="w-10 h-10"></i>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">معمای روزانه</h1>
        <p class="text-gray-500 dark:text-gray-400 mb-8">پاسخ صحیح بدهید و ۵ سکه جایزه بگیرید.</p>

        <div class="bg-indigo-600 text-white rounded-2xl p-8 mb-8 shadow-lg shadow-indigo-600/20 transform rotate-1">
            <p class="text-xl font-medium leading-relaxed">
                "آن چیست که تا وقتی به زبان نیامده مال توست، اما وقتی به زبان آمد دیگر مال تو نیست؟"
            </p>
        </div>

        <form method="POST" action="" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="answer" placeholder="پاسخ خود را بنویسید..." required class="w-full text-center rounded-xl border-gray-300 dark:border-border-dark bg-gray-50 dark:bg-background-dark focus:ring-primary focus:border-primary h-14 px-4 text-lg">
            <button type="submit" class="w-full py-4 bg-primary text-white font-bold rounded-xl hover:bg-primary-dark transition-all hover:shadow-red-glow">
                ثبت پاسخ و دریافت جایزه
            </button>
        </form>
    </div>
</div>
{% endblock %}
