{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-20 px-4 text-center">
    <div class="bg-white rounded-2xl shadow-xl p-10 relative overflow-hidden">
        <div class="absolute inset-0 bg-red-600 opacity-5 animate-pulse"></div>

        <div class="w-24 h-24 mx-auto bg-red-100 text-red-600 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner relative">
            <span class="absolute w-full h-full rounded-full border-4 border-red-500 border-t-transparent animate-spin"></span>
            🎲
        </div>

        <h2 class="text-2xl font-bold mb-2">در حال جستجوی هم‌صحبت...</h2>
        <p class="text-gray-500 mb-8">لطفا منتظر بمانید تا شخص دیگری به صورت تصادفی به شما متصل شود.</p>

        <div class="text-3xl font-mono font-bold text-gray-800 mb-8" id="timer">00:00</div>

        <a href="{% url 'landing' %}" class="inline-block bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-full hover:bg-gray-300 transition">انصراف</a>
    </div>
</div>

<script>
    let seconds = 0;
    const timerEl = document.getElementById('timer');
    setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
    }, 1000);

    // Poll to check if receiver joined
    setInterval(() => {
        fetch('/api/v1/calls/status/{{ room_id }}/')
            .then(res => res.json())
            .then(data => {
                if(data.status === 'ACTIVE' || data.receiver_id) {
                    window.location.href = "{% url 'call_room' room_id %}";
                }
            })
            .catch(err => console.error(err));
    }, 3000);
</script>
{% endblock %}
