{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto mt-10 px-4">
    <div class="text-center mb-12">
        <h2 class="text-3xl font-bold mb-4">خرید سکه</h2>
        <p class="text-gray-600">برای تماس تصادفی، بازی و ارسال هدیه سکه بخرید</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-5xl mx-auto">
        {% for package in packages %}
        <div class="bg-white rounded-2xl shadow-sm border border-yellow-200 p-6 text-center hover:shadow-md transition relative flex flex-col">
            <div class="w-16 h-16 mx-auto bg-yellow-100 rounded-full flex items-center justify-center mb-4">
                <span class="text-2xl">🪙</span>
            </div>
            <h3 class="text-xl font-bold mb-1 text-gray-800" dir="ltr">{{ package.coins }}</h3>
            <p class="text-gray-500 text-sm mb-4">سکه</p>
            <div class="text-lg font-bold text-gray-900 mb-6" dir="ltr">
                {{ package.price }} <span class="text-sm text-gray-500 font-normal">تومان</span>
            </div>
            <a href="{% url 'upload_receipt' %}?target=coins_{{ package.id }}&amount={{ package.price }}" class="block w-full bg-yellow-500 text-white text-center font-bold py-2 rounded-lg hover:bg-yellow-600 transition mt-auto">
                خرید
            </a>
        </div>
        {% empty %}
        <p class="col-span-4 text-center text-gray-500">بسته‌ای یافت نشد.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
