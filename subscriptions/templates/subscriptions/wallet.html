{% extends 'base.html' %}
{% block content %}
<div class="bg-white rounded-lg shadow-md p-8 max-w-2xl mx-auto">
    <h2 class="text-3xl font-bold mb-4 text-center">کیف پول شما</h2>
    <div class="text-center text-4xl text-indigo-600 font-bold mb-8">{{ wallet.coin_balance }} سکه</div>

    <div class="flex justify-center gap-4 mb-8">
        <button class="bg-green-600 text-white px-6 py-2 rounded shadow hover:bg-green-500">شارژ حساب</button>
        <button class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-500">خرید گیفت</button>
    </div>

    <h3 class="text-xl font-bold mb-4 border-b pb-2">آخرین تراکنش‌ها</h3>
    <ul>
        {% for t in transactions %}
            <li class="flex justify-between py-2 border-b">
                <span>{{ t.transaction_type }}</span>
                <span class="{% if t.amount > 0 %}text-green-600{% else %}text-red-600{% endif %}">
                    {{ t.amount }}
                </span>
            </li>
        {% empty %}
            <li class="py-2 text-gray-500">تراکنشی یافت نشد.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
